<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Status</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #090910; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #171725; padding: 30px 24px; border-radius: 15px; border: 1px solid #39394d; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #b58cff; margin-top: 0; margin-bottom: 15px; }
    p { color: #ccc; font-size: 14px; line-height: 1.5; }
    input { width: 100%; padding: 13px; margin: 15px 0; border-radius: 8px; box-sizing: border-box; background: #10101b; color: white; border: 1px solid #414158; font-size: 15px; outline: none; }
    input:focus { border-color: #a879ed; }
    button { width: 100%; padding: 14px; border-radius: 8px; background: #9258df; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
    button:hover { background: #a66af0; }
    .hidden { display: none !important; }
    .active { color: #28a745 !important; font-weight: bold; font-size: 18px; }
    .expired { color: #dc3545 !important; font-weight: bold; font-size: 18px; }
    .pending { color: #ffc107 !important; font-weight: bold; font-size: 18px; }
    .wa-btn { background: #25D366; color: white; padding: 15px; text-decoration: none; border-radius: 8px; display: block; margin-top: 20px; font-weight: bold; box-sizing: border-box; }
    .back-link { display: block; margin-top: 25px; color: #88889a; text-decoration: none; font-size: 14px; }
    .back-link:hover { color: white; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card" id="login-card">
    <h2>Check Membership</h2>
    <p>Apna WhatsApp number dalein:</p>
    <input type="tel" id="wa-number" placeholder="e.g. 03001234567">
    <button onclick="startChecking()">Check Status</button>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <div class="card hidden" id="status-card">
    <h2 id="status-text">Checking...</h2>
    <p id="m-name"></p>
    <p id="m-expiry"></p>
    
    <div id="group-link-container" class="hidden">
      <p style="color: #ccc; font-size: 14px;">Aapki membership active hai! Niche se group join karein:</p>
      
      <!-- YAHAN NAYA LINK DAAL DIYA HAI -->
      <a href="https://chat.whatsapp.com/BqlmNMQVjwhKzhyuUjPTa1" target="_blank" class="wa-btn">Join WhatsApp Group</a>
    </div>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://axwqvydjcceahaulupax.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cVnafI3dTnjY-5b3_P4iVQ_x5l79Akk';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let checkInterval;

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById('status-card').classList.add('hidden');
      document.getElementById('login-card').classList.remove('hidden');

      const urlParams = new URLSearchParams(window.location.search);
      const numberParam = urlParams.get('number');
      if (numberParam) {
        document.getElementById('wa-number').value = numberParam;
        startChecking();
      }
    });

    async function startChecking() {
      const waNumber = document.getElementById('wa-number').value.trim();
      if (!waNumber) return alert("Please enter number");

      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('status-card').classList.remove('hidden');
      document.getElementById('status-text').className = 'pending';
      document.getElementById('status-text').innerText = 'Checking...';

      clearInterval(checkInterval);
      await checkStatus(waNumber);
      checkInterval = setInterval(() => checkStatus(waNumber), 5000);
    }

    async function checkStatus(waNumber) {
      let cleanNum = waNumber.replace(/\s+/g, '');
      let numWith92 = cleanNum;
      if (cleanNum.startsWith('0')) numWith92 = '92' + cleanNum.slice(1);
      let numWithout92 = cleanNum.replace(/^92/, '');
      let numWith0 = '0' + numWithout92;

      const searchFormats = [cleanNum, numWith92, numWithout92, numWith0, '+' + numWith92];

      const { data: pendingData } = await supabaseClient
        .from('payment_submissions')
        .select('*')
        .in('whatsapp_number', searchFormats)
        .eq('status', 'pending')
        .limit(1);

      const { data: memberData } = await supabaseClient
        .from('memberships')
        .select('*')
        .in('whatsapp_number', searchFormats)
        .order('created_at', { ascending: false })
        .limit(1);

      const statusText = document.getElementById('status-text');
      const groupContainer = document.getElementById('group-link-container');

      if (memberData && memberData.length > 0) {
        const data = memberData[0];
        const expiryDate = new Date(data.expires_at);

        document.getElementById('m-name').innerText = 'Name: ' + data.full_name;
        document.getElementById('m-expiry').innerText = 'Expires On: ' + expiryDate.toLocaleDateString();

        if (expiryDate > new Date()) {
          statusText.innerText = 'Active ✅';
          statusText.className = 'active';
          groupContainer.classList.remove('hidden');
        } else {
          statusText.innerText = 'Expired ❌';
          statusText.className = 'expired';
          groupContainer.classList.add('hidden');
        }
      } else if (pendingData && pendingData.length > 0) {
        statusText.innerText = 'Pending Approval ⏳';
        statusText.className = 'pending';
        document.getElementById('m-name').innerText = 'Name: ' + pendingData[0].full_name;
        document.getElementById('m-expiry').innerText = 'Admin approval ka intezar hai...';
        groupContainer.classList.add('hidden');
      } else {
        statusText.innerText = 'No Record Found ❌';
        statusText.className = 'expired';
        document.getElementById('m-name').innerText = '';
        document.getElementById('m-expiry').innerText = 'Is number se koi request nahi mili.';
        groupContainer.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
